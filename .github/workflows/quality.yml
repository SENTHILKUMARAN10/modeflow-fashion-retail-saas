name: ModeFlow quality

on:
  push:
    branches: [main, modeflow-production-hardening-v1, modeflow-test-fixes-v1, modeflow-regression-fixes-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: npm run test:syntax
      - name: Unit and integration tests
        run: npm test
      - name: Prevent privileged Supabase secrets in frontend
        shell: bash
        run: |
          if grep -niE 'service_role|SUPABASE_SERVICE_ROLE|sb_secret_' index.html app.js supabase/*.js; then
            echo 'Privileged Supabase credential pattern found in shipped frontend files.'
            exit 1
          fi
      - name: Verify production migrations exist
        run: |
          test -f supabase/migrations/20260907_modeflow_production_hardening.sql
          test -f supabase/migrations/20260907_modeflow_regression_fixes.sql
