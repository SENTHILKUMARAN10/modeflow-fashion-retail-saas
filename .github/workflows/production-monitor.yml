name: SalesDesk production health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production health endpoint
        env:
          HEALTH_URL: ${{ vars.SALESDESK_HEALTH_URL || 'https://modeflow-fashion-retail-saas.vercel.app/api/health' }}
        run: |
          set -euo pipefail
          echo "Checking SalesDesk health endpoint"
          body="$(curl --fail --silent --show-error --max-time 20 "$HEALTH_URL")"
          echo "$body"
          node -e '
            const body=JSON.parse(process.argv[1]);
            if(body.service!=="SalesDesk") throw new Error("Unexpected service identity");
            if(body.status==="error") throw new Error("SalesDesk health status is error");
            if(body.checks?.database!=="ok") throw new Error("Database health check is not ok");
            if(body.status==="degraded") console.warn("SalesDesk is reachable but one or more production integrations still need configuration.");
          ' "$body"
