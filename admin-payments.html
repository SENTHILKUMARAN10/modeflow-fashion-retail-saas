<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e6">
  <title>Velora · Payment verification</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f4f0e6;--surface:#fffdf8;--ink:#182019;--muted:#697168;--line:#d9d2c5;--green:#1f5b49;--green2:#164638;--soft:#e7eee9;--danger:#a3473f;--warn:#9a6a2c}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}body{font-family:'Plus Jakarta Sans',system-ui,sans-serif}.shell{min-height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr)}
    .side{position:sticky;top:0;height:100dvh;border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;background:#f6f2e9}.brand{display:flex;gap:12px;align-items:center;padding:2px 4px 26px}.mark{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font:700 22px 'Playfair Display',serif}.brand strong{display:block;font:700 22px 'Playfair Display',serif}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.side-label{font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted);padding:12px 8px}.side-link{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 14px;border:1px solid transparent;border-radius:12px;text-decoration:none;color:var(--ink);font-weight:700}.side-link.active{background:var(--surface);border-color:var(--line)}.side-link b{font-size:12px;color:var(--muted)}.side-bottom{margin-top:auto}.content{min-width:0;padding:30px 34px 52px}.topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding-bottom:26px;border-bottom:1px solid var(--line);margin-bottom:26px}.eyebrow{margin:0 0 7px;font-size:10px;letter-spacing:.14em;font-weight:800;color:var(--muted)}h1,h2,.stat strong{font-family:'Playfair Display',Georgia,serif}.topbar h1{font-size:clamp(34px,4vw,54px);line-height:1;margin:0;letter-spacing:-.04em}.btn{min-height:42px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 13px 'Plus Jakarta Sans';cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.reject{background:#fff8f6;border-color:#ead3ce;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}.stat:first-child{background:linear-gradient(145deg,var(--green),var(--green2));color:#fff;border-color:transparent}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:9px}.stat:first-child span{color:#d8e7df}.stat strong{font-size:34px}.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 30px rgba(31,40,33,.04)}.card-head{padding:20px 22px;border-bottom:1px solid var(--line)}.card-head h2{font-size:26px;margin:0 0 4px}.card-head small{color:var(--muted)}.status{padding:24px;color:var(--muted)}.row{display:grid;grid-template-columns:minmax(190px,1.25fr) minmax(120px,.7fr) minmax(130px,.75fr) minmax(170px,.9fr) minmax(180px,.9fr);gap:16px;align-items:center;padding:18px 22px;border-top:1px solid #ebe6dc}.row:first-child{border-top:0}.biz{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#f7eddc;color:var(--warn);font-size:11px;font-weight:800}.pill.active{background:var(--soft);color:var(--green2)}.pill.rejected{background:#fff0ed;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty-icon{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;margin-bottom:10px;color:var(--green)}
    @media(max-width:980px){.shell{grid-template-columns:86px minmax(0,1fr)}.side{padding:22px 10px}.brand{justify-content:center}.brand>div:last-child,.side-label,.side-link span{display:none}.side-link{justify-content:center;padding:0}.content{padding:24px 20px 40px}.row{grid-template-columns:1.2fr .8fr .8fr 1fr}.row .actions{grid-column:1/-1}}
    @media(max-width:700px){.shell{display:block}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:row;align-items:center;gap:10px}.brand{padding:0;margin-right:auto}.brand>div:last-child{display:block}.side-label{display:none}.side nav{display:none}.side-bottom{margin:0}.side-bottom .side-link{display:flex;padding:0 12px}.side-bottom .side-link span{display:block}.content{padding:20px 14px 34px}.topbar{align-items:flex-start}.topbar h1{font-size:34px}.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr;gap:10px;padding:16px}.row .actions{grid-column:auto}.actions .btn{flex:1}.card-head{padding:17px}.stat{padding:17px}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><div class="mark">V</div><div><strong>Velora</strong><small>Administration</small></div></div>
    <div class="side-label">ADMIN</div>
    <nav><a class="side-link active" href="/admin-payments"><b>10</b><span>Payment verification</span></a></nav>
    <div class="side-bottom"><a class="side-link" href="/"><b>←</b><span>Back to workspace</span></a></div>
  </aside>
  <main class="content">
    <header class="topbar"><div><p class="eyebrow">VELORA ADMIN</p><h1>Payment verification</h1></div><a class="btn" href="/">Back to Velora</a></header>
    <section class="summary"><article class="stat"><span>Pending review</span><strong id="pendingCount">—</strong></article><article class="stat"><span>Approved</span><strong id="approvedCount">—</strong></article><article class="stat"><span>Rejected</span><strong id="rejectedCount">—</strong></article></section>
    <section class="card"><div class="card-head"><h2>Payment submissions</h2><small>Verify QR/UPI payments before activating customer access.</small></div><div id="list"><div class="status">Loading payments…</div></div></section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase/config.js"></script>
<script>
const cfg=window.TK_SUPABASE_CONFIG;
const sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'modeflow-auth-v1'}});
const list=document.getElementById('list');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function token(){const {data}=await sb.auth.getSession();return data?.session?.access_token||'';}
function counts(rows){pendingCount.textContent=rows.filter(x=>x.status==='pending_verification').length;approvedCount.textContent=rows.filter(x=>x.status==='active').length;rejectedCount.textContent=rows.filter(x=>x.status==='rejected').length;}
async function load(){
 const t=await token();if(!t){list.innerHTML='<div class="status"><div class="empty-icon">!</div>Sign in to Velora first, then reopen this page.</div>';counts([]);return;}
 const r=await fetch('/api/admin-payments',{headers:{authorization:'Bearer '+t}}),d=await r.json().catch(()=>({}));
 if(!r.ok){list.innerHTML='<div class="status">'+esc(d.error||'Unable to load payments')+'</div>';counts([]);return;}
 const rows=d.payments||[];counts(rows);if(!rows.length){list.innerHTML='<div class="status"><div class="empty-icon">₹</div>No payment submissions yet.</div>';return;}
 list.innerHTML=rows.map(p=>{const name=p.businesses?.name||'Business',ref=String(p.provider_subscription_id||'').replace(/^UPI:/,''),pending=p.status==='pending_verification';return `<div class="row"><div><div class="biz">${esc(name)}</div><div class="meta">UPI ref: ${esc(ref||'—')}</div></div><div><strong>${esc(p.plan_interval)}</strong><div class="meta">${esc(p.currency)} ${esc(p.amount)}</div></div><div><span class="pill ${esc(p.status)}">${esc(p.status)}</span></div><div class="meta">${esc(new Date(p.updated_at).toLocaleString())}</div><div class="actions">${pending?`<button class="btn primary" onclick="act('${esc(p.business_id)}','approve',this)">Approve</button><button class="btn reject" onclick="act('${esc(p.business_id)}','reject',this)">Reject</button>`:'—'}</div></div>`}).join('');
}
async function act(businessId,action,button){if(!confirm((action==='approve'?'Approve':'Reject')+' this payment?'))return;const t=await token();button.disabled=true;const r=await fetch('/api/admin-payment-action',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify({businessId,action})}),d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'Unable to update payment');button.disabled=false;return;}await load();}
load();
</script>
</body>
</html>
