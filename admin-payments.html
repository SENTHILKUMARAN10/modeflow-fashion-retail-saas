<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>ModeFlow Payment Verification</title>
  <style>
    :root{--bg:#f7f8fa;--surface:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;--primary:#1f3a5f;--primary2:#172b46;--danger:#b42318;--success:#16835d;--warning:#9a671b;--sidebar:#111827}
    *{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,a{font:inherit}.shell{min-height:100dvh;display:grid;grid-template-columns:238px minmax(0,1fr)}.side{position:sticky;top:0;height:100dvh;background:var(--sidebar);color:#d1d5db;padding:24px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px}.mark{width:34px;height:34px;border-radius:9px;background:#28496f;color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{display:block;color:#fff;font-size:16px}.brand small{display:block;color:#8b95a5;font-size:11px;margin-top:2px}.side-label{padding:10px 9px;color:#727d8e;font-size:10px;letter-spacing:.12em;font-weight:800}.side-link{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 11px;border-radius:9px;color:#aab3c0;text-decoration:none;font-weight:650;font-size:14px}.side-link.active{background:#233044;color:#fff}.side-link:hover{background:#182231;color:#fff}.side-bottom{margin-top:auto}.content{min-width:0;padding:0 30px 44px}.topbar{position:sticky;top:0;z-index:10;margin:0 -30px 28px;padding:19px 30px;background:rgba(247,248,250,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:800;color:var(--muted);margin:0 0 5px}.topbar h1{margin:0;font-size:30px;letter-spacing:-.035em;line-height:1.08}.btn{border:1px solid var(--line);border-radius:10px;min-height:40px;padding:0 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#374151}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}.btn.reject{background:#fff5f4;border-color:#f0d5d1;color:var(--danger)}.btn:disabled{opacity:.55;cursor:not-allowed}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.stat span{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.stat strong{font-size:26px;letter-spacing:-.03em}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px rgba(16,24,40,.03),0 8px 24px rgba(16,24,40,.04);overflow:hidden}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}.card-head h2{margin:0;font-size:17px;letter-spacing:-.02em}.card-head small{color:var(--muted)}.status{padding:22px;color:var(--muted)}.row{display:grid;grid-template-columns:minmax(190px,1.3fr) minmax(110px,.7fr) minmax(130px,.8fr) minmax(150px,1fr) minmax(170px,.9fr);gap:14px;align-items:center;padding:16px 20px;border-top:1px solid #edf0f3}.row:first-of-type{border-top:0}.biz{font-weight:800;font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-word}.pill{display:inline-flex;align-items:center;max-width:100%;padding:5px 9px;border-radius:999px;background:#fff5df;color:var(--warning);font-size:11px;font-weight:800;white-space:nowrap}.pill.active{background:#eaf7f1;color:var(--success)}.pill.rejected{background:#fff1f0;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty-icon{width:42px;height:42px;border-radius:11px;background:#f0f2f5;display:grid;place-items:center;margin-bottom:10px;color:#687386}@media(max-width:980px){.shell{grid-template-columns:78px minmax(0,1fr)}.side{padding:18px 10px}.brand{justify-content:center;padding-left:0;padding-right:0}.brand>div:last-child,.side-label,.side-link span{display:none}.side-link{justify-content:center;padding:0}.content{padding:0 20px 36px}.topbar{margin:0 -20px 22px;padding:16px 20px}.row{grid-template-columns:1.2fr .7fr .8fr 1fr}.row .actions{grid-column:1/-1}}
    @media(max-width:700px){.shell{display:block;padding-bottom:74px}.side{position:fixed;left:8px;right:8px;bottom:8px;top:auto;width:auto;height:60px;padding:6px;border-radius:16px;border:1px solid #273244;z-index:30;box-shadow:0 14px 36px rgba(15,23,42,.28)}.brand,.side-label,.side-bottom{display:none}.side nav{display:flex;height:100%;gap:4px}.side-link{flex:1;min-width:0;height:46px;font-size:11px;display:flex}.side-link span{display:block;font-size:10px}.content{padding:0 12px 24px}.topbar{margin:0 -12px 16px;padding:13px 12px;align-items:flex-start}.topbar h1{font-size:22px}.topbar .btn{min-height:38px;padding:0 10px;font-size:12px}.summary{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:14px}.stat strong{font-size:22px}.summary .stat:last-child{grid-column:1/-1}.card-head{padding:15px}.row{grid-template-columns:1fr;gap:10px;padding:15px}.row .actions{grid-column:auto}.actions .btn{flex:1}.pill{white-space:normal}.meta{word-break:break-all}}
    @media(max-width:390px){.summary{grid-template-columns:1fr}.summary .stat:last-child{grid-column:auto}.topbar{gap:8px}.topbar h1{font-size:20px}.eyebrow{display:none}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand"><div class="mark">M</div><div><strong>ModeFlow</strong><small>Administration</small></div></div>
      <div class="side-label">ADMIN</div>
      <nav><a class="side-link active" href="/admin-payments"><b>₹</b><span>Payments</span></a></nav>
      <div class="side-bottom"><a class="side-link" href="/"><b>←</b><span>Back to ModeFlow</span></a></div>
    </aside>
    <main class="content">
      <header class="topbar"><div><p class="eyebrow">MODEFLOW ADMIN</p><h1>Payment verification</h1></div><a class="btn" href="/">Back to ModeFlow</a></header>
      <section class="summary"><article class="stat"><span>Pending review</span><strong id="pendingCount">—</strong></article><article class="stat"><span>Approved</span><strong id="approvedCount">—</strong></article><article class="stat"><span>Rejected</span><strong id="rejectedCount">—</strong></article></section>
      <section class="card"><div class="card-head"><div><h2>Payment submissions</h2><small>Verify UPI payments before approving access.</small></div></div><div id="list"><div class="status">Loading payments…</div></div></section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase/config.js"></script>
  <script>
    const cfg=window.TK_SUPABASE_CONFIG;
    const sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'modeflow-auth-v1'}});
    const list=document.getElementById('list');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function token(){const {data}=await sb.auth.getSession();return data?.session?.access_token||'';}
    function counts(rows){document.getElementById('pendingCount').textContent=rows.filter(x=>x.status==='pending_verification').length;document.getElementById('approvedCount').textContent=rows.filter(x=>x.status==='active').length;document.getElementById('rejectedCount').textContent=rows.filter(x=>x.status==='rejected').length;}
    async function load(){
      const t=await token();
      if(!t){list.innerHTML='<div class="status"><div class="empty-icon">!</div>Sign in to ModeFlow first, then reopen this page.</div>';counts([]);return;}
      const r=await fetch('/api/admin-payments',{headers:{authorization:'Bearer '+t}});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){list.innerHTML='<div class="status">'+esc(d.error||'Unable to load payments')+'</div>';counts([]);return;}
      const rows=d.payments||[];counts(rows);
      if(!rows.length){list.innerHTML='<div class="status"><div class="empty-icon">₹</div>No payment submissions yet.</div>';return;}
      list.innerHTML=rows.map(p=>{
        const name=p.businesses?.name||'Business';
        const ref=String(p.provider_subscription_id||'').replace(/^UPI:/,'');
        const pending=p.status==='pending_verification';
        return `<div class="row"><div><div class="biz">${esc(name)}</div><div class="meta">UPI ref: ${esc(ref||'—')}</div></div><div><strong>${esc(p.plan_interval)}</strong><div class="meta">${esc(p.currency)} ${esc(p.amount)}</div></div><div><span class="pill ${esc(p.status)}">${esc(p.status)}</span></div><div class="meta">${esc(new Date(p.updated_at).toLocaleString())}</div><div class="actions">${pending?`<button class="btn primary" onclick="act('${esc(p.business_id)}','approve',this)">Approve</button><button class="btn reject" onclick="act('${esc(p.business_id)}','reject',this)">Reject</button>`:'—'}</div></div>`;
      }).join('');
    }
    async function act(businessId,action,button){
      if(!confirm((action==='approve'?'Approve':'Reject')+' this payment?')) return;
      const t=await token();button.disabled=true;
      const r=await fetch('/api/admin-payment-action',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify({businessId,action})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){alert(d.error||'Unable to update payment');button.disabled=false;return;}
      await load();
    }
    load();
  </script>
</body>
</html>
