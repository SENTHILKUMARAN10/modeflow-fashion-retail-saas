<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ModeFlow Payment Verification</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:#f5f7fb;color:#0f172a}.wrap{max-width:1100px;margin:0 auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:clamp(24px,4vw,34px)}.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:#1d4ed8;color:#fff}.btn.reject{background:#fee2e2;color:#991b1b}.btn:disabled{opacity:.55;cursor:not-allowed}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 8px 30px rgba(15,23,42,.06);overflow:hidden}.status{padding:16px;color:#64748b}.row{display:grid;grid-template-columns:1.3fr .8fr .7fr 1fr 1fr;gap:14px;align-items:center;padding:16px;border-top:1px solid #eef2f7}.row:first-child{border-top:0}.biz{font-weight:800}.meta{font-size:13px;color:#64748b;margin-top:4px;word-break:break-all}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:800}.pill.active{background:#dcfce7;color:#166534}.pill.rejected{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:780px){.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"><div><small>MODEFLOW ADMIN</small><h1>Payment verification</h1></div><a class="btn" href="/">Back to ModeFlow</a></div>
    <div class="card" id="list"><div class="status">Loading payments…</div></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase/config.js"></script>
  <script>
    const cfg=window.TK_SUPABASE_CONFIG;
    const sb=window.supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'modeflow-auth-v1'}});
    const list=document.getElementById('list');
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function token(){const {data}=await sb.auth.getSession();return data?.session?.access_token||'';}
    async function load(){
      const t=await token();
      if(!t){list.innerHTML='<div class="status">Sign in to ModeFlow first, then reopen this page.</div>';return;}
      const r=await fetch('/api/admin-payments',{headers:{authorization:'Bearer '+t}});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){list.innerHTML='<div class="status">'+esc(d.error||'Unable to load payments')+'</div>';return;}
      const rows=d.payments||[];
      if(!rows.length){list.innerHTML='<div class="status">No payment submissions yet.</div>';return;}
      list.innerHTML=rows.map(p=>{
        const name=p.businesses?.name||'Business';
        const ref=String(p.provider_subscription_id||'').replace(/^UPI:/,'');
        const pending=p.status==='pending_verification';
        return `<div class="row"><div><div class="biz">${esc(name)}</div><div class="meta">UPI ref: ${esc(ref||'—')}</div></div><div><strong>${esc(p.plan_interval)}</strong><div class="meta">${esc(p.currency)} ${esc(p.amount)}</div></div><div><span class="pill ${esc(p.status)}">${esc(p.status)}</span></div><div class="meta">${esc(new Date(p.updated_at).toLocaleString())}</div><div class="actions">${pending?`<button class="btn primary" onclick="act('${esc(p.business_id)}','approve',this)">Approve</button><button class="btn reject" onclick="act('${esc(p.business_id)}','reject',this)">Reject</button>`:'—'}</div></div>`;
      }).join('');
    }
    async function act(businessId,action,button){
      if(!confirm((action==='approve'?'Approve':'Reject')+' this payment?')) return;
      const t=await token();button.disabled=true;
      const r=await fetch('/api/admin-payment-action',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+t},body:JSON.stringify({businessId,action})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){alert(d.error||'Unable to update payment');button.disabled=false;return;}
      await load();
    }
    load();
  </script>
</body>
</html>
